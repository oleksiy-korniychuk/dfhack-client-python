[project]
name = "dfhack_client_python"
version = "0.1.0"
description = "A python library for interacting with the DFHack through its custom RPC protocol."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.31.1",
    "requests>=2.32.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
